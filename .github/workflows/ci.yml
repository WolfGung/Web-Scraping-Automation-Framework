name: CI

# The workflow the README badge reads, and only its push runs on main. It runs the
# gate — lint and every test that needs no network, defined in `checks.yml` — on
# every push to main and every pull request, and nothing else: no schedule, no
# site outside this repository, no publication. Everything that reaches the
# practice sites lives in `nightly.yml`, so somebody else's server can never turn
# this workflow, or the badge, red.
on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing this workflow runs writes to the repository or publishes
# anything, and a token no job needs is a token no job should have.
permissions:
  contents: read

jobs:
  gate:
    name: The gate
    uses: ./.github/workflows/checks.yml
